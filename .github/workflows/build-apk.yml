name: Build FinLedger APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create . --platforms=android --org com.finledger --project-name finledger
      - name: Restore FinLedger Android integration
        run: |
          mkdir -p android/app/src/main/kotlin/com/finledger/finledger
          cp android_overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp android_overrides/MainActivity.kt android/app/src/main/kotlin/com/finledger/finledger/MainActivity.kt
          cp android_overrides/BankSmsReceiver.kt android/app/src/main/kotlin/com/finledger/finledger/BankSmsReceiver.kt
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FinLedger-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
